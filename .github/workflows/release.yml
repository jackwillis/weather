name: Release

# Builds the artifacts a GitHub runner can build and, for a pushed tag vX.Y.Z only, creates a DRAFT pre-release.
# The workflow never publishes and never creates a tag. Jack tags, then publishes the draft (docs/PROJECT-MANAGEMENT.md).
# A manual run (workflow_dispatch) builds and checks everything and uploads workflow artifacts; it creates no release.
# NetBSD binaries/package are attached afterwards by tools/release-attach.sh (they need the cross toolchain or maul).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
  pull_request:   # changes to the pipeline itself are proven by a build with no release
    paths: ['.github/workflows/release.yml', 'tools/check-release.sh']

permissions:
  contents: read

env:
  # Pinned by digest; record it in the release notes. Update deliberately.
  RETRO68_IMAGE: ghcr.io/autc04/retro68@sha256:2c2ec5ca764c98b7460522be7327426e3b4d039a317c22d6ccdcc64e5247f21a

jobs:
  build:
    name: Source tarball and Mac OS 9 image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3 openssl libx11-dev xvfb imagemagick xfonts-base xfonts-75dpi hfsutils podman
      - name: Version from the Makefile
        id: version
        run: echo "version=$(sed -n 's/^VERSION *= *//p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Repository policy
        run: sh tools/check-policy.sh
      - name: Source tarball, reproducibility and full host checks
        run: |
          make dist
          make distcheck
      - name: Mac OS 9 image (Retro68 container pinned by digest)
        run: make os9 CONTAINER=podman RETRO68_IMAGE="$RETRO68_IMAGE"
      - name: Check and list the release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: sh tools/check-release.sh "$VERSION" "build/dist/weather-$VERSION.tar.gz" build/os9/Weather.dsk "$TAG"
      - name: Collect artifacts and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          cp "build/dist/weather-$VERSION.tar.gz" out/
          cp build/os9/Weather.dsk "out/Weather-$VERSION.dsk"
          cd out && for f in *; do
            printf 'SHA512 (%s) = %s\n' "$f" "$(sha512sum "$f" | cut -d' ' -f1)"
          done > SHA512SUMS
          cat SHA512SUMS
          echo "Retro68 image: $RETRO68_IMAGE" > ../retro68-image.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            out/*
            retro68-image.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft pre-release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dl
      - name: Create the draft (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          notes=docs/release-notes/$version.md
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          { cat "$notes"; echo; echo "## Build"; cat dl/retro68-image.txt; } > notes.md
          gh release create "$TAG" --draft --prerelease --verify-tag --title "Weather $version" --notes-file notes.md \
            dl/weather-"$version".tar.gz dl/Weather-"$version".dsk dl/SHA512SUMS
