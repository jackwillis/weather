name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a PR branch replaces its running checks. Each commit on main gets its own group, so merging several PRs in a row
  # leaves a finished run for every one of them (a shared group would cancel the running one, or drop the queued ones).
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  os9:
    name: Mac OS 9 cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Keep in sync with release.yml; update deliberately.
      RETRO68_IMAGE: ghcr.io/autc04/retro68@sha256:2c2ec5ca764c98b7460522be7327426e3b4d039a317c22d6ccdcc64e5247f21a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install container runner
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends podman make
      - name: Cross-build production applications and check Open Transport layout
        run: make os9 check-ot-layout CONTAINER=podman RETRO68_IMAGE="$RETRO68_IMAGE"

  linux-ppc:
    name: Big-endian Linux/PPC runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution cross compiler and user-mode emulator
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends g++-powerpc-linux-gnu qemu-user make
      - name: Record toolchain provenance
        run: |
          powerpc-linux-gnu-g++ --version
          qemu-ppc --version
          dpkg-query -W g++-powerpc-linux-gnu gcc-13-powerpc-linux-gnu qemu-user libc6-powerpc-cross
      - name: Execute ABI, unit and mutation checks with UBSan traps
        run: |
          if make -j2 TARGET=linux-ppc check > build-ppc.log 2>&1; then
            cat build-ppc.log
          else
            cat build-ppc.log
            exit 1
          fi
      - name: Save PowerPC build and runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ppc-diagnostics
          path: build-ppc.log
          if-no-files-found: ignore
          retention-days: 7

  host:
    name: Host, GUI and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and GUI dependencies
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends g++ make python3 openssl libx11-dev xvfb imagemagick xfonts-base xfonts-75dpi
      - name: Host checks, including GUI and provisioning
        run: make check
      - name: Address and undefined-behavior sanitizers
        run: make REQUIRE_ASAN=1 check-san
      - name: Save GUI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-diagnostics
          path: |
            build/gui-host/*.png
            build/gui-host/log.txt
          if-no-files-found: ignore
          retention-days: 7

  host-32:
    name: 32-bit parser and CLI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install 32-bit build dependencies
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends g++-multilib make python3 openssl
      - name: Unit, mutation and CLI checks with 32-bit long and UBSan
        run: make TARGET=host-32 check
