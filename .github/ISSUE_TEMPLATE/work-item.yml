name: Work item
description: A bug, improvement or task
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: A checklist of things that must be true when this is done.
      placeholder: "- [ ] ..."
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Where this came from (audit finding ID, PR, log) and how it was observed (reproduced, read only, simulated).
