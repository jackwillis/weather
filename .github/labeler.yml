# Applied by .github/workflows/labeler.yml from the paths a PR changes.
area/core: ["src/core/**", "src/app/**"]
area/os9: ["src/platform/os9/**", "src/ui/os9/**", "os9/**", "spike/os9/**", "docs/OS9-*"]
area/netbsd: ["src/ui/xweather/**", "src/cli/**", "mk/netbsd-*", "tools/mkpkg-*", "tools/ctwm-*", "tools/xinitrc-*"]
area/tls: ["src/tls/**", "test/tls_*", "tools/*anchors*"]
area/ci: [".github/**", "Makefile", "mk/**", "test/flags.sh", "test/anchors.sh"]
area/docs: ["docs/**", "README.md", "AGENTS.md", "TODO.md", "CHANGELOG.md", "man/**"]
